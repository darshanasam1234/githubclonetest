name: Manual Environment Demo

on:
  workflow_dispatch:
    inputs:
      firstname:
        description: "first name"
        required: true
        default: MS
        type: choice
        options:
          - MS
          - MAC

      lastname:
        description: "last name"
        required: true
        default: Windows
        type: choice
        options:
          - Windows
          - Apple
          

jobs:
  print-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Print selected environment
        run: echo "You selected the ${{ inputs.firstname }} ${{inputs.lastname}} environment"

      - name: Run environment-specific step
        run: |
          echo input.firstname input.lastname
